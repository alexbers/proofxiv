[project]
name = "proofxiv-protocol"
version = "0.1.0"
description = "Shared schemas and signing for the ProofXiv server and worker"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.9",
    "pynacl>=1.5",
    "rfc8785>=0.1.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/proofxiv_protocol"]
