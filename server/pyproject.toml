[project]
name = "proofxiv-server"
version = "0.1.0"
description = "ProofXiv server: registry, review exchange, queues, trust levels, REST and MCP"
requires-python = ">=3.12"
dependencies = [
    "proofxiv-protocol",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "pydantic-settings>=2.6",
    "python-multipart>=0.0.17",
    "pyjwt>=2.10",
    "httpx>=0.27",
    "structlog>=24.4",
    "mcp>=1.2",
]

[project.scripts]
proofxiv-server = "proofxiv_server.cli:main"

[tool.uv.sources]
proofxiv-protocol = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/proofxiv_server"]
