[package]
name = "proofxiv-checkers"
version = "0.1.0"
edition = "2021"
description = "ProofXiv reference checkers (Rust implementation)"
publish = false

[[bin]]
name = "proofxiv-check"
path = "src/main.rs"

[dependencies]
serde = "1"
serde_json = "1"
num-bigint = "0.4"
num-integer = "0.1"
num-traits = "0.2"
num-rational = "0.4"

[profile.release]
opt-level = 3
debug = false
lto = "thin"
codegen-units = 4
panic = "unwind"
